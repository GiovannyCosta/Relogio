<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive digital clock with date, greeting and theme controls." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script type="module" src="./assets/js/main.js"></script>
  <title>Orbit</title>
</head>

<body>
  <main class="page">
    <section class="clock" aria-label="Digital clock">
      <header class="clock-header">
        <a class="brand" href="./" aria-label="Orbit home">
          <img src="./assets/images/logo-orbit.svg" alt="Orbit Clock" />
        </a>
        <div class="header-actions">
          <button class="language-button" id="language-button" type="button" aria-label="Mudar idioma">BR</button>
          <button class="theme-button" id="theme-button" type="button" aria-label="Switch theme">
            <span class="sun" aria-hidden="true">☀</span><span class="moon" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <div class="date-area">
        <p class="weekday" id="weekday">Monday</p>
        <p class="full-date" id="full-date">January 1, 2026</p>
      </div>

      <div class="time-area">
        <p class="period-label" id="period-label">Current time</p>
        <time class="time" id="time" datetime="00:00:00">00:00<span>:00</span></time>
        <p class="timezone" id="timezone">Local time</p>
      </div>

      <footer class="clock-footer">
        <div class="greeting-area">
          <img id="period-image" src="./assets/images/weather01.png" alt="Morning" />
          <div><span id="welcome">Welcome</span><strong id="greeting">Good morning</strong></div>
        </div>
        <span class="live-status"><i></i> <span id="live-text">Live</span></span>
      </footer>
    </section>
  </main>
</body>

</html>
