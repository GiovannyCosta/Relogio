<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/ico/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/toggle.css">
    <title>Relógio Clássico</title>
</head>

<body>
    <div class="container">
        <!-- Cabeçalho com data -->
        <div class="header">
            <div class="week-wrapper">
                <p class="day"><!--Domingo--></p>
                <p class="date"><!--22 de Outubro de 2023--></p>
            </div>
            <div class="flex-wrapper">
                <button class="lang-button" id="lang-btn">EN</button>
                <div class="toggle-wrapper">
                    <input type="checkbox" id="toggle-theme">
                    <label for="toggle-theme" class="toggle-label">
                        <span class="icon icon-sun">☀️</span>
                        <span class="icon icon-moon">🌙</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Wrapper para o ícone de clima -->
        <div class="weather-wrapper">
            <img id="img" alt="Ícone de clima atual" src="">
        </div>

        <!-- Seção principal com hora e saudação -->
        <div class="section">
            <div class="time-wrapper">
                <h1 class="time"><!--00:00--></h1>
                <p class="greeting"><!----></p>
            </div>
        </div>
    </div>

    <script src="./index.js"></script>
    <script src="./toggle.js"></script>
</body>

</html>
